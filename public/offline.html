<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#020403" />
    <title>DOMINASE — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 2rem; background: #020403; color: #f4fbf8; }
      main { width: min(100%, 30rem); text-align: center; }
      img { width: 5.5rem; height: 5.5rem; object-fit: contain; }
      h1 { margin: 1.5rem 0 .75rem; font-size: clamp(1.8rem, 7vw, 2.8rem); letter-spacing: -.04em; }
      p { margin: 0; color: #9fb0a8; line-height: 1.7; }
      a { display: inline-flex; align-items: center; margin-top: 1.75rem; min-height: 2.8rem; border: 1px solid #244b3c; border-radius: 999px; padding: .7rem 1.2rem; background: #0b8f63; color: #fff; font: inherit; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline.</h1>
      <p>Reconnect to continue exploring DOMINASE.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
